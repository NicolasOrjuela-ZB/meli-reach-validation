name: Regenerar dashboard desde BigQuery

on:
  schedule:
    - cron: "15 12 * * 1"   # lunes 07:15 America/Bogota (12:15 UTC)
  workflow_dispatch:         # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install google-cloud-bigquery pandas db-dtypes

      - name: Credencial GCP
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > "$RUNNER_TEMP/gcp.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp.json" >> "$GITHUB_ENV"

      - name: Generar docs/index.html
        run: python scripts/build_dashboard.py

      - name: Commit si cambió
        run: |
          git config user.name "zb-bot"
          git config user.email "zb-bot@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet && echo "Sin cambios" || git commit -m "chore: dashboard actualizado $(date -u +%F)" && git push
